[couchdb]
single_node=true

[chttpd]
bind_address=0.0.0.0
port=5984
require_valid_user=true

[httpd]
enable_cors=true

[cors]
origins = https://obsidian.brain.cryptocomputer.ca, app://obsidian.md, capacitor://localhost, http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE

[admins]
; The admin user is supplied by COUCHDB_USER and COUCHDB_PASSWORD at first boot.
